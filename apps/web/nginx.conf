# nginx config for the Gym Assistant web SPA.
# Serves the static Vite bundle and falls back to index.html for client-side
# routes so react-router deep links work on hard refresh.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Never cache the HTML shell — it references hashed asset filenames, so it
    # must always be fetched fresh to pick up a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed, immutable build assets — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Simple health endpoint for platform/uptime checks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA history fallback: serve the requested file, else index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
