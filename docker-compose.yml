# Full-stack Gym Assistant — Postgres + Go API + web frontend + remote MCP.
#
# Two uses:
#   1. Local end-to-end run of the production images:
#        cp .env.docker.example .env && docker compose up --build
#      Then open http://localhost:8081 (web) — it talks to the API on :8080.
#   2. Dokploy "Docker Compose" deployment: point Dokploy at this file. Dokploy
#      injects your configured environment variables and manages routing/TLS to
#      each service via Traefik (map your domains to `web` :80 and `api` :8080).
#
# All secrets/config come from the environment (.env locally, Dokploy env in
# prod) — nothing sensitive is hardcoded here.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gym_assistant}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gym} -d ${POSTGRES_DB:-gym_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8080
      # Compose-internal DB hostname is the service name `db`.
      DATABASE_URL: postgres://${POSTGRES_USER:-gym}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gym_assistant}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the bundle at build time — must be the browser-reachable
        # API origin (NOT the compose-internal `api` hostname).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8081}:80"

  # Remote MCP server (PRD 0023) — read-only tools over Streamable HTTP + OAuth,
  # added in Claude as a custom connector at https://<your-mcp-domain>/mcp.
  # In Dokploy, map that domain to `mcp` :3000.
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      # Public https origin of this service (the OAuth issuer), no path.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8082}
      # Required (>= 32 chars, `openssl rand -hex 32`); the mcp service refuses
      # to start without it. Keys every sealed OAuth token — rotate to revoke
      # all connections.
      MCP_OAUTH_SECRET: ${MCP_OAUTH_SECRET:-}
      # Must be https unless loopback, so point at the public API origin.
      GYM_API_BASE_URL: ${GYM_API_BASE_URL:-https://api-gym.irfanmaulana007.com}
      MCP_TRUST_PROXY: ${MCP_TRUST_PROXY:-0}
    ports:
      - "${MCP_PORT:-8082}:3000"

volumes:
  db-data:
